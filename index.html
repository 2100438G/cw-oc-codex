<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Card Wars Codex | Character Archives</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loader">
            <div class="loader-ring"></div>
            <div class="loader-ring delay"></div>
            <span class="loader-text" data-lang-key="loading">LOADING<span class="dots"></span></span>
        </div>
    </div>

    <button id="lang-toggle" class="lang-toggle" aria-label="Toggle language">
        <span class="lang-option" data-lang="jp">日本語</span>
        <span class="lang-divider">/</span>
        <span class="lang-option" data-lang="en">EN</span>
    </button>

    <!-- SELECT PAGE -->
    <section id="select-page" class="select-page">
        <div class="select-background">
            <div class="select-orb orb-1"></div>
            <div class="select-orb orb-2"></div>
            <div class="select-orb orb-3"></div>
        </div>
        <div class="select-container">
            <header class="select-header">
                <div class="header-badge">
                    <span class="badge-line"></span>
                    <span class="badge-text" data-lang-key="project">Project: Card Wars</span>
                    <span class="badge-line"></span>
                </div>
                <h1 class="select-title">THE CODEX</h1>
                <h2 class="select-title-jp">カードウォーズ・コーデックス</h2>
                <div class="select-underline"></div>
                <p class="select-subtitle" data-lang-key="select">Select</p>
            </header>
            <div class="character-grid" id="character-grid"></div>
            <footer class="select-footer">
                <div class="footer-line"></div>
                <p data-lang-key="archives">Character Design Archives</p>
                <div class="footer-decoration">
                    <span class="dec-dot"></span>
                    <span class="dec-dot"></span>
                    <span class="dec-dot"></span>
                </div>
            </footer>
        </div>
    </section>

    <!-- CHARACTER DETAIL PAGE -->
    <main id="character-page" class="character-page hidden">

        <nav class="back-nav">
            <button class="back-btn" id="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="back-icon">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                <span class="back-text" data-lang-key="back">ALL CHARACTERS</span>
            </button>
        </nav>

        <!-- HERO SECTION -->
        <section class="hero-section" id="hero-section">
            <canvas class="particle-canvas" id="particle-canvas"></canvas>
            <div class="hero-speedlines"></div>
            <div class="hero-bracket hero-bracket-left">「</div>
            <div class="hero-bracket hero-bracket-right">」</div>
            <div class="hero-art" id="hero-art">
                <img id="hero-image" src="" alt="" />
            </div>
            <div class="hero-text" id="hero-text">
                <p class="hero-badges" id="hero-badges"></p>
                <h1 class="hero-title">
                    <span class="hero-title-primary" id="hero-title-primary"></span>
                    <span class="hero-title-secondary" id="hero-title-secondary"></span>
                </h1>
                <div class="hero-underline"></div>
                <p class="hero-tagline" id="hero-tagline"></p>
            </div>
            <div class="scroll-indicator">
                <div class="scroll-chevron"></div>
                <span class="scroll-text" data-lang-key="scroll">SCROLL</span>
            </div>
        </section>

        <!-- CONTENT -->
        <div class="content-column">

            <!-- PROFILE -->
            <section class="detail-section" id="profile-section">
                <div class="detail-header">
                    <h3 class="detail-title" data-lang-key="profile">PROFILE</h3>
                    <div class="detail-accent"></div>
                </div>
                <div class="profile-grid">
                    <div class="profile-art" id="profile-art-container">
                        <img id="profile-art-img" src="" alt="" />
                    </div>
                    <div class="profile-info">
                        <p class="profile-stats" id="profile-stats"></p>
                        <div class="profile-block">
                            <h4 class="profile-block-title" data-lang-key="appearance">APPEARANCE</h4>
                            <div class="profile-block-body" id="detail-appearance"></div>
                        </div>
                        <div class="profile-block">
                            <h4 class="profile-block-title" data-lang-key="personality">PERSONALITY</h4>
                            <div class="profile-block-body" id="detail-personality"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- OFFICIAL GALLERY -->
            <section class="gallery-section" id="gallery-section-official">
                <div class="gallery-zone-header">
                    <h2 class="gallery-zone-title" data-lang-key="official_art">OFFICIAL ART</h2>
                    <span class="gallery-zone-title-jp" data-lang-key="official_art_sub"></span>
                    <div class="gallery-zone-accent"></div>
                </div>
                <div class="gallery-grid" id="gallery-grid-official"></div>
            </section>

            <!-- ABILITIES -->
            <section class="detail-section" id="abilities-section">
                <div class="detail-header">
                    <h3 class="detail-title" data-lang-key="abilities">ABILITIES</h3>
                    <div class="detail-accent"></div>
                </div>
                <div class="detail-body" id="detail-abilities"></div>
            </section>

            <!-- LORE -->
            <section class="detail-section" id="lore-section">
                <div class="detail-header">
                    <h3 class="detail-title" data-lang-key="lore">LORE</h3>
                    <div class="detail-accent"></div>
                </div>
                <div class="detail-body" id="detail-lore"></div>
            </section>

            <!-- STATS & PALETTE -->
            <section class="stats-palette-section" id="stats-palette-section">
                <div class="sp-block">
                    <div class="sp-header">
                        <h3 class="sp-title" data-lang-key="stats">COMBAT STATS</h3>
                        <div class="sp-accent"></div>
                    </div>
                    <div class="stats-content">
                        <div class="radar-container"><canvas id="radar-chart"></canvas></div>
                        <div class="stats-list" id="stats-list"></div>
                    </div>
                </div>
                <div class="sp-block">
                    <div class="sp-header">
                        <h3 class="sp-title" data-lang-key="palette">COLOR PALETTE</h3>
                        <div class="sp-accent"></div>
                    </div>
                    <div class="palette-content" id="palette-content"></div>
                </div>
            </section>

            <!-- COMMISSIONED GALLERY -->
            <section class="gallery-section" id="gallery-section-commissioned">
                <div class="gallery-zone-header">
                    <h2 class="gallery-zone-title" data-lang-key="commissioned">COMMISSIONED</h2>
                    <span class="gallery-zone-title-jp" data-lang-key="commissioned_sub"></span>
                    <div class="gallery-zone-accent"></div>
                </div>
                <div class="gallery-grid" id="gallery-grid-commissioned"></div>
            </section>

            <footer class="page-footer">
                <div class="footer-line"></div>
                <p class="footer-text" data-lang-key="project">Project: Card Wars</p>
                <p class="footer-sub" data-lang-key="archives">Character Design Archives</p>
            </footer>

        </div>
    </main>

    <!-- LIGHTBOX -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-backdrop"></div>
        <div class="lightbox-container">
            <div class="lightbox-content">
                <img id="lightbox-image" src="" alt="" />
                <video id="lightbox-video" loop muted playsinline></video>
            </div>
            <div class="lightbox-sidebar">
                <div class="lightbox-info">
                    <span class="lightbox-label" id="lightbox-label"></span>
                    <span class="lightbox-counter" id="lightbox-counter">1 / 3</span>
                </div>
                <a id="download-btn" class="download-btn" href="" download>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span data-lang-key="download">Download</span>
                </a>
                <button id="lightbox-close" class="lightbox-close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    <span data-lang-key="close">Close</span>
                </button>
            </div>
        </div>
        <button class="lightbox-nav prev" id="lightbox-prev">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="lightbox-nav next" id="lightbox-next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="lightbox-hint">
            <span data-lang-key="navigate_hint">← → Navigate · ESC Close</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
